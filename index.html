<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>락토코리아 바이어 데스크</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap">
<style>
:root{
  /* Layout: exhibition badge board → per-show workspace (KPI row · 3 charts · tabbed lists) → right-side buyer drawer; forms open in a sheet */
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#E8EDEB; --sunk:#F7F9F8;
  --ink:#14201D; --ink-2:#52615C; --ink-3:#83908C; --line:#D5DCD9; --line-2:#E5EAE8;
  --accent:#2349C9; --accent-2:#1A3AA6; --accent-soft:#E3E9FB; --on-accent:#FFFFFF;
  --good:#17784C; --good-soft:#DCF2E6; --warn:#9A5B00; --warn-soft:#FAEFD7; --bad:#BD3219; --bad-soft:#FBE4DE;
  --s-met:#B7C4F0; --s-info:#8BA0E8; --s-sample:#5C79DD; --s-quote:#2D51CB; --s-order:#17784C; --s-hold:#C3CBC8; --s-lost:#DE9C8D;
  --g-A:#BD3219; --g-B:#A86F00; --g-C:#6C7A76;
  --shadow:0 1px 2px rgba(20,32,29,.05),0 8px 24px rgba(20,32,29,.06);
  --overlay:rgba(14,22,20,.42);
  --logo-plate:transparent;
  --f-display:"Schibsted Grotesk","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#151D1B; --surface-2:#1E2825; --sunk:#111816;
    --ink:#E5ECE9; --ink-2:#A1B0AB; --ink-3:#71807B; --line:#2B3733; --line-2:#222C29;
    --accent:#7D9BFF; --accent-2:#A3B8FF; --accent-soft:#1E2A52; --on-accent:#0B1230;
    --good:#45C08A; --good-soft:#123326; --warn:#E5A93B; --warn-soft:#352812; --bad:#F07A62; --bad-soft:#3A1A14;
    --s-met:#34437A; --s-info:#435BA8; --s-sample:#5876D6; --s-quote:#7D9BFF; --s-order:#45C08A; --s-hold:#46534F; --s-lost:#8C4B3E;
    --g-A:#F07A62; --g-B:#E5A93B; --g-C:#93A29D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --overlay:rgba(0,0,0,.58); --logo-plate:#F4F7F6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1B; --surface-2:#1E2825; --sunk:#111816;
  --ink:#E5ECE9; --ink-2:#A1B0AB; --ink-3:#71807B; --line:#2B3733; --line-2:#222C29;
  --accent:#7D9BFF; --accent-2:#A3B8FF; --accent-soft:#1E2A52; --on-accent:#0B1230;
  --good:#45C08A; --good-soft:#123326; --warn:#E5A93B; --warn-soft:#352812; --bad:#F07A62; --bad-soft:#3A1A14;
  --s-met:#34437A; --s-info:#435BA8; --s-sample:#5876D6; --s-quote:#7D9BFF; --s-order:#45C08A; --s-hold:#46534F; --s-lost:#8C4B3E;
  --g-A:#F07A62; --g-B:#E5A93B; --g-C:#93A29D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --overlay:rgba(0,0,0,.58); --logo-plate:#F4F7F6;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sub{color:var(--ink-2);font-size:12.5px}
.muted{color:var(--ink-3)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0;flex:1 1 auto;overflow:hidden}
.brand-logo{height:42px;width:auto;display:block;padding:4px 7px;border-radius:9px;background:var(--logo-plate);flex:none}
.brand-sep{width:1px;height:28px;background:var(--line);flex:none}
.brand-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-t b{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.hdr-actions{margin-left:auto;display:flex;gap:8px;flex:none}
@media (max-width:420px){ .hdr-actions .btn{padding-inline:10px} }

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn-danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;color:var(--ink-2);font-size:20px;line-height:1;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:600;cursor:pointer;text-align:left}
.link:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.short{display:none}
@media (max-width:620px){ .long{display:none} .short{display:inline} .brand-t span{display:none} }
@media (max-width:540px){ .brand-sep,.brand-t{display:none} .brand-logo{height:38px} }

main{padding-block:22px 64px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
#notice:empty{display:none}
.notice{margin-top:16px;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:13.5px}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.page-head h1{font-family:var(--f-display);font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.01em}
.lede{color:var(--ink-2);margin-top:6px;max-width:62ch}
.h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-l{font-size:12.5px;color:var(--ink-2);font-weight:500}
.kpi-v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-v small{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:2px}
.kpi-s{font-size:12px;color:var(--ink-3)}
.kpi-bad .kpi-v{color:var(--bad)}
.kpi-meter{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.kpi-meter i{display:block;height:100%;background:var(--good);border-radius:4px}

/* home */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:980px){ .home-grid{grid-template-columns:1fr} }
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.badge{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease;min-width:0}
.badge:hover{transform:translateY(-2px)}
.badge-band{background:var(--band);color:#fff;padding:26px 18px 16px;position:relative;display:grid;gap:3px}
.badge-band::before{content:"";position:absolute;top:10px;left:50%;width:46px;height:7px;margin-left:-23px;border-radius:4px;background:var(--bg)}
.badge-kicker{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.82}
.badge-name{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
.badge-loc{font-size:12.5px;opacity:.88}
.badge-body{padding:14px 18px 16px;display:grid;gap:12px}
.badge-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.badge-dates{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.badge-stand{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.badge-stand b{color:var(--ink);font-weight:500;letter-spacing:0}
.badge-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding-block:10px}
.badge-stats div{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding-left:10px;border-left:1px solid var(--line-2)}
.badge-stats div:first-child{padding-left:0;border-left:0}
.badge-stats b{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.badge-stats span{font-size:11.5px;color:var(--ink-2)}
.badge-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.badge-add{border:1.5px dashed var(--line);border-radius:14px;background:transparent;display:grid;place-items:center;align-content:center;gap:6px;min-height:220px;cursor:pointer;color:var(--ink-2);font-weight:600;padding:20px;text-align:center}
.badge-add:hover{border-color:var(--accent);color:var(--accent)}
.badge-add b{font-size:28px;font-weight:400;line-height:1}
.skel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:260px;display:grid;place-items:center;color:var(--ink-3)}

.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status-live{background:var(--good-soft);color:var(--good)}
.status-soon{background:var(--accent-soft);color:var(--accent)}
.status-done{background:var(--surface-2);color:var(--ink-2)}

.side-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.uplist{list-style:none;margin:0;padding:0;display:grid}
.up{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-2);padding:10px 2px;cursor:pointer}
.uplist li:first-child .up{border-top:0}
.up:hover strong{color:var(--accent)}
.up-main{display:flex;flex-direction:column;min-width:0}
.up-main strong{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-main .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-show{grid-column:2;font-size:11.5px;color:var(--ink-3)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.grade{font-family:var(--f-display);font-weight:700;font-size:12px;min-width:22px;height:22px;padding:0 5px;display:inline-grid;place-items:center;border-radius:6px;color:var(--gc);background:color-mix(in srgb,var(--gc) 15%,transparent);flex:none}
.grade-A{--gc:var(--g-A)} .grade-B{--gc:var(--g-B)} .grade-C{--gc:var(--g-C)}
.tagc{display:inline-block;padding:1px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:12px;white-space:nowrap}
.reqc{display:inline-block;padding:1px 8px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);font-size:12px;white-space:nowrap}
.due{display:inline-block;font-family:var(--f-mono);font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.due-bad{background:var(--bad-soft);color:var(--bad)}
.due-warn{background:var(--warn-soft);color:var(--warn)}
.due-ok{background:var(--good-soft);color:var(--good)}
.tagrow{display:flex;flex-wrap:wrap;gap:4px}

/* pipeline */
.pipe{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);gap:2px}
.pipe span{display:block;min-width:4px}
.pipe-big{height:18px;border-radius:6px}
.legend{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.legend em{font-style:normal;color:var(--ink-3);font-size:12px;font-family:var(--f-mono);min-width:36px;text-align:right}

/* show hero */
.crumb{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink-2);font-weight:600;cursor:pointer;font-size:13px}
.crumb:hover{color:var(--accent)}
.hero{background:var(--band);color:#fff;border-radius:16px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.07);pointer-events:none}
.hero h1{font-family:var(--f-display);font-size:clamp(26px,4.4vw,38px);font-weight:800;letter-spacing:-.015em;line-height:1.1;overflow-wrap:anywhere}
.hero-kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-top:10px;opacity:.95}
.hero-meta .mono{font-size:12.5px}
.hero .status{background:rgba(255,255,255,.16);color:#fff}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.btn-onband{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.38);color:#fff}
.btn-onband:hover{background:rgba(255,255,255,.24)}
@media (max-width:720px){ .hero{grid-template-columns:1fr} }
.golden{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-radius:var(--r);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);font-size:13.5px}
.golden b{font-weight:700}
.golden.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}

/* charts */
.charts{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:16px}
@media (max-width:980px){ .charts{grid-template-columns:1fr 1fr} .charts .panel:first-child{grid-column:1 / -1} }
@media (max-width:640px){ .charts{grid-template-columns:1fr} }
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:14px;display:flex;justify-content:space-between;gap:8px}
.panel h3 span{font-weight:400;color:var(--ink-3)}
.bars{display:flex;align-items:flex-end;gap:6px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--ink-2);border-radius:8px}
.bar:hover{background:var(--sunk)}
.bar-n{font-family:var(--f-mono);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.bar-col{position:relative;width:70%;max-width:42px;height:104px;background:var(--surface-2);border-radius:6px 6px 3px 3px;overflow:hidden}
.bar-fill{position:absolute;left:0;right:0;bottom:0;background:var(--s-sample);border-radius:6px 6px 0 0}
.bar.on .bar-fill{background:var(--accent)}
.bar.on .bar-l{color:var(--ink);font-weight:600}
.bar-l{font-size:11px;white-space:nowrap;font-family:var(--f-mono)}
.bar-d{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.hbars{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.hbars li{display:grid;grid-template-columns:minmax(0,96px) minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px}
.hbars .hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars .hb-t{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hbars .hb-t i{display:block;height:100%;background:var(--s-info);border-radius:5px}
.hbars b{font-family:var(--f-mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.chart-empty{color:var(--ink-3);font-size:13px;padding:24px 0;text-align:center}
.gradebar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:11px 14px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;margin-bottom:-1px;font-size:14px}
.tab:hover{color:var(--ink)}
@media (max-width:440px){ .tab{padding:10px 9px;font-size:13.5px} .count{margin-left:3px} }
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin-left:5px;font-weight:500}
.count.bad{background:var(--bad-soft);color:var(--bad)}
.tabbody{display:grid;gap:16px;padding-top:16px}

/* day filter chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2)}
.fchip b{font-family:var(--f-mono);font-weight:500;font-size:11.5px;color:var(--ink-3)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fchip.on b{color:var(--bg);opacity:.75}

/* meeting table */
.dgroup{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dhead{display:flex;align-items:baseline;gap:10px;padding:11px 16px;background:var(--sunk);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dhead h3{font-size:14.5px;font-weight:700}
.dhead .mono{font-size:12px;color:var(--ink-3)}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;min-width:0;position:relative}
.toolbar input,.toolbar select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 11px;min-width:0}
.toolbar .search input{width:100%;padding-left:34px}
.search::before{content:"";position:absolute;left:12px;top:50%;width:11px;height:11px;margin-top:-7px;border:2px solid var(--ink-3);border-radius:50%}
.search::after{content:"";position:absolute;left:23px;top:50%;width:6px;height:2px;margin-top:4px;background:var(--ink-3);transform:rotate(45deg)}
.segsm{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}

/* phonebook */
.pb{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:12px;align-items:start}

.copy{border:1px solid var(--line);background:var(--surface);border-radius:5px;font-size:11px;padding:1px 6px;cursor:pointer;color:var(--ink-2);flex:none}

}

/* follow-up board */
.fu-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}

.fu-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.fu-sec.sec-bad > header{box-shadow:inset 3px 0 0 var(--bad)}

.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:32px 20px;display:grid;justify-items:center;gap:10px;text-align:center}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slidein .18s ease-out}

.dr-head{padding:16px 20px 14px;background:var(--surface);border-bottom:1px solid var(--line);display:grid;gap:12px}
.dr-top{display:flex;align-items:flex-start;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}

.tl{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}

.tl li{position:relative;padding:0 0 14px 22px}
.tl li::before{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--c,var(--ink-3))}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:var(--overlay);display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

}
.fs{border:0;padding:0;margin:0;display:grid;gap:12px;min-width:0}

.form input:not([type=checkbox]):not([type=radio]),.form select,.form textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;width:100%;min-width:0}
.form textarea{resize:vertical;line-height:1.55}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

.opts{display:flex;gap:6px;flex-wrap:wrap}

.opt span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--sunk);font-size:13px;color:var(--ink-2);cursor:pointer}
.opt span i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.opt input:checked + span{border-color:var(--oc,var(--accent));background:color-mix(in srgb,var(--oc,var(--accent)) 13%,var(--surface));color:var(--ink);font-weight:600}

.opt.g-A{--oc:var(--g-A)} .opt.g-B{--oc:var(--g-B)} .opt.g-C{--oc:var(--g-C)}
.opt.g-A b{color:var(--g-A)} .opt.g-B b{color:var(--g-B)} .opt.g-C b{color:var(--g-C)}

@media (max-width:640px){ .bitem{grid-template-columns:1fr} .bitem > img{width:100%;height:120px} .bfields{grid-template-columns:1fr 1fr} }
.cardthumbs{display:flex;gap:8px;flex-wrap:wrap}

<body>

<header class="topbar">

    <img src="assets/logo.png" alt="LACTO KOREA" class="login-logo" width="135" height="58">
    <h1>바이어 데스크</h1>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const STAGES = [
  {k:'met', label:'상담완료'}, {k:'info', label:'자료발송'}, {k:'sample', label:'샘플발송'},
  {k:'quote', label:'견적·협상'}, {k:'order', label:'오더 성사'}, {k:'hold', label:'보류'}, {k:'lost', label:'종료'}
];
const STAGE_IDX = Object.fromEntries(STAGES.map((s, i) => [s.k, i]));
const GRADES = [{k:'A', label:'유력'}, {k:'B', label:'관심'}, {k:'C', label:'일반'}];
const FU_TYPES = ['이메일', '전화', '화상미팅', '메신저', '샘플 발송', '견적서 발송', '방문 미팅', '기타'];
const TYPE_STAGE = {'샘플 발송':'sample', '견적서 발송':'quote'};
const REQUESTS = ['카탈로그', '가격표', '샘플', '견적서', '인증서류', '추가 미팅', '공장 방문'];
const BIZ = ['수입상', '유통사', '도매', '리테일', '외식·급식', '제조사', '에이전트', '온라인', '기타'];
const COUNTRIES = ['France','Germany','Italy','Spain','Portugal','United Kingdom','Ireland','Netherlands','Belgium','Luxembourg','Switzerland','Austria','Poland','Czech Republic','Hungary','Romania','Greece','Sweden','Norway','Denmark','Finland','Turkey','United States','Canada','Mexico','Brazil','Chile','United Arab Emirates','Saudi Arabia','Qatar','Kuwait','Israel','Egypt','Morocco','South Africa','India','China','Hong Kong','Taiwan','Japan','Korea','Vietnam','Thailand','Singapore','Malaysia','Indonesia','Philippines','Australia','New Zealand','Kazakhstan','Mongolia'];
const SHOW_COLORS = ['#2349C9', '#107038', '#0F766E', '#8B3A8F', '#B26B00', '#C2461F'];
const AV_COLORS = ['#2349C9', '#107038', '#0F766E', '#8B3A8F', '#B26B00', '#C2461F', '#38505E'];
const HIDE_CODES = new Set([]);
const OK_TYPES = /^image\/(jpeg|png|webp|gif)$/;
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const DOW = ['일', '월', '화', '수', '목', '금', '토'];

/* ---------- utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const isYmd = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 86400000);
const fmtMD = s => { if (!isYmd(s)) return ''; const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const fmtLong = s => { if (!isYmd(s)) return ''; const d = parseYmd(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`; };
const fmtDots = s => isYmd(s) ? s.replace(/-/g, '.') : '';
const stageK = k => STAGE_IDX[k] !== undefined ? k : 'met';
const stageLabel = k => STAGES[STAGE_IDX[stageK(k)]].label;
const gradeK = g => ['A', 'B', 'C'].includes(g) ? g : 'B';
const colorK = c => /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : SHOW_COLORS[0];
const uniq = a => [...new Set(a.filter(Boolean))];
const hashColor = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return AV_COLORS[Math.abs(h) % AV_COLORS.length]; };
const initials = name => {
  const t = String(name || '').trim(); if (!t) return '?';
  if (/[가-힣]/.test(t[0])) return t.slice(0, 2);
  const p = t.split(/\s+/); return ((p[0][0] || '') + (p[1] ? p[1][0] : '')).toUpperCase();
};
const indexKey = s => {
  const ch = String(s || '').trim().charAt(0); if (!ch) return '#';
  const code = ch.charCodeAt(0) - 0xAC00;
  if (code >= 0 && code <= 11171) { const c = CHO[Math.floor(code / 588)]; return ({'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'})[c] || c; }
  const u = ch.normalize('NFD').charAt(0).toUpperCase();
  return /[A-Z]/.test(u) ? u : '#';
};
const byDateDesc = (a, b) => (b.date || '').localeCompare(a.date || '') || (b.time || '').localeCompare(a.time || '') || (b.createdAt || 0) - (a.createdAt || 0);

/* ---------- state ---------- */
const S = {
  db: null, user: null, dl: true, assets: null, cardOK: false, onModalClose: null, photoUrls: new Map(), status: 'connecting', meId: null, meName: '', canWriteFlag: null, readOnly: false,
  shows: [], buyers: [], meetings: [], followups: [], got: {},
  view: 'home', showId: null, tab: 'daily', day: 'all',
  q: '', country: 'all', grade: 'all', scope: 'show',
  drawerId: null, confirm: null, mBy: new Map(), fBy: new Map(), hashDone: false
};
const canWrite = () => !!S.db && S.canWriteFlag !== false && !S.readOnly;
const showById = id => S.shows.find(s => s.id === id);
const buyerById = id => S.buyers.find(b => b.id === id);
const meetsOf = id => S.mBy.get(id) || [];
const fusOf = id => S.fBy.get(id) || [];
const lastContact = b => (fusOf(b.id)[0] || {}).date || '';
const isOverdue = b => isYmd(b.nextDate) && b.nextDate < today() && stageK(b.stage) !== 'lost';
const inShow = (b, sid) => (b.showIds || []).includes(sid);
const latestShowOf = b => { const m = meetsOf(b.id)[0]; return m ? m.showId : (b.showIds || []).slice(-1)[0] || ''; };
const sortedShows = () => [...S.shows].sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));
function defaultShowId() {
  if (S.view === 'show' && showById(S.showId)) return S.showId;
  const t = today();
  const live = S.shows.find(s => s.startDate <= t && t <= s.endDate); if (live) return live.id;
  const past = sortedShows().find(s => s.endDate < t); if (past) return past.id;
  return (sortedShows()[0] || {}).id || '';
}
function showDays(s) {
  const out = []; if (!s || !isYmd(s.startDate) || !isYmd(s.endDate)) return out;
  let d = s.startDate, guard = 0;
  while (d <= s.endDate && guard++ < 21) { out.push(d); d = addDays(d, 1); }
  return out;
}
function showStatus(s) {
  const t = today();
  if (!isYmd(s.startDate) || !isYmd(s.endDate)) return {k:'soon', label:'일정 미정'};
  if (t < s.startDate) return {k:'soon', label:`D-${diffDays(s.startDate, t)}`};
  if (t <= s.endDate) return {k:'live', label:`진행 중 · ${diffDays(t, s.startDate) + 1}일차`};
  return {k:'done', label:`종료 +${diffDays(t, s.endDate)}일`};
}
function defaultDateFor(s) {
  const t = today();
  if (s && isYmd(s.startDate) && t >= s.startDate && t <= s.endDate) return t;
  return s && isYmd(s.startDate) ? s.startDate : t;
}
function reindex() {
  S.mBy = new Map(); S.fBy = new Map();
  for (const m of S.meetings) { if (!S.mBy.has(m.buyerId)) S.mBy.set(m.buyerId, []); S.mBy.get(m.buyerId).push(m); }
  for (const f of S.followups) { if (!S.fBy.has(f.buyerId)) S.fBy.set(f.buyerId, []); S.fBy.get(f.buyerId).push(f); }
  S.mBy.forEach(a => a.sort(byDateDesc)); S.fBy.forEach(a => a.sort(byDateDesc));
}
function showStats(id) {
  const buyers = S.buyers.filter(b => inShow(b, id));
  const meetings = S.meetings.filter(m => m.showId === id && buyerById(m.buyerId));
  const stageCounts = Object.fromEntries(STAGES.map(s => [s.k, 0]));
  buyers.forEach(b => stageCounts[stageK(b.stage)]++);
  const t = today(), wk = addDays(t, 7);
  const touched = buyers.filter(b => fusOf(b.id).length > 0).length;
  return {
    buyers, meetings, stageCounts, touched,
    untouched: buyers.filter(b => !fusOf(b.id).length && stageK(b.stage) !== 'lost').length,
    overdue: buyers.filter(isOverdue).length,
    soon: buyers.filter(b => stageK(b.stage) !== 'lost' && isYmd(b.nextDate) && b.nextDate >= t && b.nextDate <= wk).length,
    gradeA: buyers.filter(b => gradeK(b.grade) === 'A').length,
    rate: buyers.length ? Math.round(touched / buyers.length * 100) : 0
  };
}
const allTags = () => uniq(S.meetings.flatMap(m => m.interests || [])).sort();
const allStaff = () => uniq([S.meName, ...S.meetings.map(m => m.staff), ...S.followups.map(f => f.staff)]);
const lastStaff = () => { try { return localStorage.getItem('lk-staff') || ''; } catch (_) { return ''; } };
const rememberStaff = v => { try { if (v) localStorage.setItem('lk-staff', v); } catch (_) {} };

/* ---------- small renderers ---------- */
const stagePill = k => `<span class="pill" style="--c:var(--s-${stageK(k)})"><i></i>${stageLabel(k)}</span>`;
const gradeChip = g => `<span class="grade grade-${gradeK(g)}" title="${GRADES.find(x => x.k === gradeK(g)).label}">${gradeK(g)}</span>`;
function dueChip(d, stage) {
  if (!isYmd(d)) return '';
  const n = diffDays(d, today());
  if (stageK(stage) !== 'lost' && n < 0) return `<span class="due due-bad">${-n}일 지연</span>`;
  if (n === 0) return `<span class="due due-warn">오늘</span>`;
  if (n > 0 && n <= 2) return `<span class="due due-warn">D-${n}</span>`;
  return `<span class="due">${fmtMD(d)}</span>`;
}
const kpi = (label, value, sub = '', cls = '', extra = '') =>
  `<div class="kpi ${cls}"><span class="kpi-l">${label}</span><span class="kpi-v">${value}</span>${sub ? `<span class="kpi-s">${sub}</span>` : ''}${extra}</div>`;
function pipeBar(counts, total, big) {
  if (!total) return `<div class="pipe ${big ? 'pipe-big' : ''}" aria-label="진행 단계 데이터 없음"></div>`;
  const label = STAGES.filter(s => counts[s.k]).map(s => `${s.label} ${counts[s.k]}`).join(', ');
  return `<div class="pipe ${big ? 'pipe-big' : ''}" role="img" aria-label="${esc(label)}">${STAGES.filter(s => counts[s.k]).map(s => `<span style="flex:${counts[s.k]};background:var(--s-${s.k})" title="${s.label} ${counts[s.k]}"></span>`).join('')}</div>`;
}
const primary = b => (b.contacts || [])[0] || {};
const copyBtn = text => text ? `<button class="copy" data-act="copy" data-text="${esc(text)}" aria-label="복사">복사</button>` : '';
const linkFor = (lbl, val) => lbl === 'TEL' ? 'tel:' + val.split('/')[0].replace(/[^\d+]/g, '') : (lbl === 'MAIL' && /^[^\s@]+@[^\s@]+$/.test(val) ? 'mailto:' + val : '');
const field = (lbl, val) => {
  if (!val) return '';
  const href = linkFor(lbl, val);
  return `<span class="pb-f"><span class="lbl">${lbl}</span>${href ? `<a class="val mono" href="${esc(href)}">${esc(val)}</a>` : `<span class="val mono">${esc(val)}</span>`}${copyBtn(val)}</span>`;
};

/* ---------- home ---------- */
function renderHome() {
  const shows = sortedShows();
  const t = today(), wk = addDays(t, 7);
  const active = S.buyers.filter(b => stageK(b.stage) !== 'lost');
  const overdue = active.filter(isOverdue);
  const soon = active.filter(b => isYmd(b.nextDate) && b.nextDate >= t && b.nextDate <= wk);
  const loading = S.status === 'connecting' || S.status === 'loading';
  let badges;
  if (loading && !shows.length) badges = `<div class="skel">전시회 정보를 불러오는 중…</div><div class="skel" aria-hidden="true"></div>`;
  else if (!shows.length) badges = `<div class="empty" style="grid-column:1/-1"><h3>등록된 전시회가 없습니다</h3><p>참가하는 전시회를 먼저 등록하면, 전시회마다 바이어와 상담 기록이 따로 모여 대시보드로 보입니다.</p>${canWrite() ? `<button class="btn btn-primary" data-act="new-show">+ 전시회 등록</button>` : ''}</div>`;
  else badges = shows.map(badgeCard).join('') + (canWrite() ? `<button class="badge-add" data-act="new-show"><b>+</b>다음 전시회 추가<span class="sub">Gulfood, Anuga, FOODEX 등</span></button>` : '');
  const up = active.filter(b => isYmd(b.nextDate) && b.nextDate <= addDays(t, 14)).sort((a, b) => a.nextDate.localeCompare(b.nextDate)).slice(0, 10);
  return `
  <section class="page-head">

/* ---------- show workspace ---------- */
function renderShow() {
  const s = showById(S.showId), st = showStats(s.id), status = showStatus(s);
  const golden = isYmd(s.endDate) ? addDays(s.endDate, 7) : '';

        <span class="mono">${fmtDots(s.startDate)} – ${fmtDots(s.endDate)}</span>
        <span>${esc([s.venue, s.city, s.country].filter(Boolean).join(' · '))}</span>
        ${s.booth ? `<span class="mono">STAND ${esc(s.booth)}</span>` : ''}
        <span class="status">${status.label}</span>
      </div>
    </div>
    <div class="hero-actions">
      ${canWrite() ? `<button class="btn btn-onband" data-act="edit-show" data-id="${esc(s.id)}">전시회 정보 수정</button>` : ''}
      ${S.dl ? `<button class="btn btn-onband" data-act="export" data-id="${esc(s.id)}">엑셀(CSV) 내보내기</button>` : ''}
    </div>
  </section>
  ${goldenBar}
  <section class="kpis" aria-label="${esc(s.name)} 현황">
    ${kpi('만난 바이어', st.buyers.length, `국가 ${uniq(st.buyers.map(b => b.country)).length}개`)}
    ${kpi('상담 기록', st.meetings.length, st.meetings.length ? `하루 평균 ${(st.meetings.length / Math.max(1, showDays(s).length)).toFixed(1)}건` : '')}
    ${kpi('A등급 바이어', st.gradeA, st.buyers.length ? `전체의 ${Math.round(st.gradeA / st.buyers.length * 100)}%` : '')}
    ${kpi('팔로우업 진행률', `${st.rate}<small>%</small>`, `${st.touched}/${st.buyers.length}곳 연락 완료`, '', `<div class="kpi-meter"><i style="width:${st.rate}%"></i></div>`)}
    ${kpi('팔로우업 지연', st.overdue, st.overdue ? '예정일이 지난 건' : `7일 내 예정 ${st.soon}건`, st.overdue ? 'kpi-bad' : '')}
  </section>
  <section class="charts">
    <div class="panel"><h3>일자별 상담 건수 <span>막대를 누르면 해당 날짜만 보기</span></h3>${dailyChart(s, st.meetings)}</div>
    <div class="panel"><h3>바이어 진행 단계 <span>${st.buyers.length}곳</span></h3>${pipeBar(st.stageCounts, st.buyers.length, true)}
      <ul class="legend">${STAGES.map(x => `<li style="--c:var(--s-${x.k})"><i></i><span>${x.label}</span><b>${st.stageCounts[x.k]}</b><em>${st.buyers.length ? Math.round(st.stageCounts[x.k] / st.buyers.length * 100) : 0}%</em></li>`).join('')}</ul>
    </div>
    <div class="panel"><h3>국가별 바이어 <span>상위 5개</span></h3>${countryChart(st.buyers)}
      <div class="gradebar">${GRADES.map(g => `<span class="pill">${gradeChip(g.k)} ${g.label} <b class="mono">${st.buyers.filter(b => gradeK(b.grade) === g.k).length}</b></span>`).join('')}</div>
    </div>
  </section>
  <section>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="${S.tab === 'daily'}" data-act="tab" data-tab="daily">일자별 상담<span class="count">${st.meetings.length}</span></button>
      <button class="tab" role="tab" aria-selected="${S.tab === 'book'}" data-act="tab" data-tab="book">바이어 주소록<span class="count">${st.buyers.reduce((n, b) => n + Math.max(1, (b.contacts || []).length), 0)}</span></button>

function dailyChart(s, meetings) {
  const days = showDays(s);
  const bars = [];
  const pre = meetings.filter(m => m.date < s.startDate).length, post = meetings.filter(m => m.date > s.endDate).length;
  if (pre) bars.push({key:'pre', l:'사전', d:'전시 전', n:pre});
  days.forEach((d, i) => bars.push({key:d, l:fmtMD(d), d:`${i + 1}일차`, n:meetings.filter(m => m.date === d).length}));
  if (post) bars.push({key:'post', l:'사후', d:'전시 후', n:post});
  if (!bars.length) return `<p class="chart-empty">전시 일정을 입력하면 날짜별 막대가 표시됩니다.</p>`;
  const max = Math.max(1, ...bars.map(b => b.n));
  return `<div class="bars">${bars.map(b => `<button class="bar ${S.day === b.key ? 'on' : ''}" data-act="day" data-day="${esc(b.key)}" aria-label="${b.l} ${b.n}건"><span class="bar-n">${b.n}</span><span class="bar-col"><span class="bar-fill" style="height:${b.n / max * 100}%"></span></span><span class="bar-l">${b.l}</span><span class="bar-d">${b.d}</span></button>`).join('')}</div>`;
}
function countryChart(buyers) {
  if (!buyers.length) return `<p class="chart-empty">바이어를 등록하면 국가 분포가 표시됩니다.</p>`;
  const m = new Map(); buyers.forEach(b => { const c = (b.country || '').trim() || '미입력'; m.set(c, (m.get(c) || 0) + 1); });
  const rows = [...m.entries()].sort((a, b) => b[1] - a[1]);
  const top = rows.slice(0, 5), rest = rows.slice(5).reduce((n, r) => n + r[1], 0);
  if (rest) top.push(['기타', rest]);
  const max = Math.max(...top.map(r => r[1]));
  return `<ul class="hbars">${top.map(([c, n]) => `<li><span class="hb-l" title="${esc(c)}">${esc(c)}</span><span class="hb-t"><i style="width:${n / max * 100}%"></i></span><b>${n}</b></li>`).join('')}</ul>`;
}

/* ---------- tab: daily ---------- */
function emptyShowBlock() {
  return `<div class="empty"><h3>아직 이 전시회에 등록된 바이어가 없습니다</h3>
    <p>부스에서 받은 명함과 상담 메모를 입력하면 날짜별 상담 목록, 주소록, 팔로우업 보드에 자동으로 함께 정리됩니다.</p>
    <div class="empty-steps"><span>① 상담일 선택</span><span>② 회사·담당자 입력</span><span>③ 상담 내용·다음 액션</span></div>
    ${canWrite() ? `<div class="empty-actions">${S.cardOK ? `<button class="btn btn-primary" data-act="card-batch">명함 사진으로 한 번에 등록</button>` : ''}<button class="btn ${S.cardOK ? '' : 'btn-primary'}" data-act="new-meeting">+ 바이어 상담 직접 입력</button></div>` : ''}</div>`;
}
function renderDaily(s, st) {
  if (!st.meetings.length) return emptyShowBlock();
  const days = showDays(s);
  const keyOf = d => d < s.startDate ? 'pre' : d > s.endDate ? 'post' : d;
  const cnt = k => st.meetings.filter(m => keyOf(m.date) === k).length;
  const chips = [{k:'all', l:'전체', n:st.meetings.length}];
  if (cnt('pre')) chips.push({k:'pre', l:'전시 전', n:cnt('pre')});
  days.forEach((d, i) => chips.push({k:d, l:`${fmtMD(d)} · ${i + 1}일차`, n:cnt(d)}));
  if (cnt('post')) chips.push({k:'post', l:'전시 후', n:cnt('post')});
  if (!chips.some(c => c.k === S.day)) S.day = 'all';
  const list = st.meetings.filter(m => S.day === 'all' || keyOf(m.date) === S.day);
  const groups = new Map();
  [...list].sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.time || '99').localeCompare(b.time || '99')).forEach(m => {
    if (!groups.has(m.date)) groups.set(m.date, []); groups.get(m.date).push(m);
  });
  return `<div class="chips" role="group" aria-label="날짜 필터">${chips.map(c => `<button class="fchip ${S.day === c.k ? 'on' : ''}" data-act="day" data-day="${esc(c.k)}">${c.l} <b>${c.n}</b></button>`).join('')}</div>
  ${list.length ? [...groups.entries()].map(([d, ms]) => {
    const idx = days.indexOf(d);
    return `<section class="dgroup">
      <div class="dhead"><h3>${fmtLong(d) || '날짜 미입력'}</h3><span class="mono">${idx >= 0 ? `${idx + 1}일차` : d < s.startDate ? '전시 전' : '전시 후'} · ${ms.length}건</span></div>
      <div class="mcols"><span>시간</span><span>회사</span><span>담당자</span><span>관심 제품 · 상담 메모</span><span>등급 · 단계</span><span>다음 액션</span></div>
      ${ms.map(meetRow).join('')}
    </section>`;
  }).join('') : `<p class="sub">선택한 날짜에 상담 기록이 없습니다.</p>`}`;
}
function meetRow(m) {
  const b = buyerById(m.buyerId); if (!b) return '';
  const c = primary(b);
  const more = (b.contacts || []).length > 1 ? ` 외 ${(b.contacts || []).length - 1}명` : '';
  return `<div class="mrow" role="button" tabindex="0" data-act="open-buyer" data-id="${esc(b.id)}">
    <div class="m-time">${esc(m.time || '—')}</div>
    <div><strong>${esc(b.company)}</strong><span class="sub">${esc([b.country, b.city, b.bizType].filter(Boolean).join(' · '))}</span></div>
    <div><span>${esc(c.name || '—')}${more}</span><span class="sub">${esc(c.title || '')}</span></div>
    <div>${(m.interests || []).length || (m.requests || []).length ? `<span class="tagrow">${(m.interests || []).map(t => `<span class="tagc">${esc(t)}</span>`).join('')}${(m.requests || []).map(t => `<span class="reqc">${esc(t)} 요청</span>`).join('')}</span>` : ''}${m.notes ? `<span class="m-note">${esc(m.notes)}</span>` : ''}</div>
    <div class="m-st">${gradeChip(b.grade)}${stagePill(b.stage)}</div>
    <div>${b.nextAction || b.nextDate ? `<span>${dueChip(b.nextDate, b.stage)}</span><span class="sub">${esc(b.nextAction || '')}</span>` : '<span class="sub">미정</span>'}</div>
  </div>`;
}

/* ---------- tab: phonebook ---------- */
function renderBook(s) {
  const pool = S.scope === 'all' ? S.buyers : S.buyers.filter(b => inShow(b, s.id));
  const countries = uniq(pool.map(b => (b.country || '').trim())).sort();
  if (S.country !== 'all' && !countries.includes(S.country)) S.country = 'all';
  return `<div class="toolbar">
      <div class="search"><input id="pb-q" type="search" placeholder="회사 · 이름 · 이메일 · 전화 · 국가 검색" value="${esc(S.q)}" aria-label="주소록 검색"></div>
      <div class="segsm" role="group" aria-label="범위"><button class="${S.scope === 'show' ? 'on' : ''}" data-act="scope" data-v="show">이 전시회</button><button class="${S.scope === 'all' ? 'on' : ''}" data-act="scope" data-v="all">전체 바이어</button></div>
      <select id="pb-country" aria-label="국가"><option value="all">전체 국가</option>${countries.map(c => `<option value="${esc(c)}" ${S.country === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <select id="pb-grade" aria-label="등급"><option value="all">전체 등급</option>${GRADES.map(g => `<option value="${g.k}" ${S.grade === g.k ? 'selected' : ''}>${g.k} ${g.label}</option>`).join('')}</select>
    </div>
    <div id="pb-results">${renderBookResults(pool)}</div>`;
}
function renderBookResults(pool) {
  if (!pool.length) return S.scope === 'show' ? emptyShowBlock() : `<p class="sub">등록된 바이어가 없습니다.</p>`;
  const q = S.q.trim().toLowerCase();
  const rows = [];
  pool.forEach(b => {
    if (S.country !== 'all' && (b.country || '').trim() !== S.country) return;
    if (S.grade !== 'all' && gradeK(b.grade) !== S.grade) return;
    const cs = (b.contacts || []).length ? b.contacts : [{}];
    cs.forEach(c => {
      const hay = [b.company, b.country, b.city, c.name, c.title, c.email, c.phone, c.msg].join(' ').toLowerCase();
      if (q && !hay.includes(q)) return;
      rows.push({b, c});
    });
  });
  if (!rows.length) return `<p class="sub">조건에 맞는 연락처가 없습니다.</p>`;
  rows.sort((x, y) => (x.b.company || '').localeCompare(y.b.company || '', 'ko') || (x.c.name || '').localeCompare(y.c.name || '', 'ko'));
  const groups = new Map();
  rows.forEach(r => { const k = indexKey(r.b.company); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
  const keys = [...groups.keys()];
  return `<div class="pb"><div>${keys.map(k => `<section class="pb-group" id="pb-L-${encodeURIComponent(k).replace(/%/g, '')}"><div class="pb-letter">${esc(k)}</div>${groups.get(k).map(({b, c}) => `
      <div class="pb-row">
        <div class="pb-av" style="background:${hashColor(b.company)}">${esc(initials(c.name || b.company))}</div>
        <div class="pb-who"><button class="link" data-act="open-buyer" data-id="${esc(b.id)}">${esc(c.name || b.company)}</button><span class="sub">${esc([c.title, c.name ? b.company : '', b.country].filter(Boolean).join(' · '))}</span></div>
        <div class="pb-fields">${field('TEL', c.phone)}${field('MAIL', c.email)}${field('MSG', c.msg)}${!c.phone && !c.email && !c.msg ? '<span class="sub">연락처 미입력</span>' : ''}</div>
        <div class="pb-side">${gradeChip(b.grade)}${stagePill(b.stage)}</div>
      </div>`).join('')}</section>`).join('')}</div>
    <nav class="pb-index" aria-label="색인">${keys.map(k => `<button data-act="jump" data-k="${esc(encodeURIComponent(k).replace(/%/g, ''))}">${esc(k)}</button>`).join('')}</nav></div>
    <p class="sub">${rows.length}명 표시 중</p>`;
}

/* ---------- tab: follow-up ---------- */
function renderFu(s, st) {
  if (!st.buyers.length) return emptyShowBlock();
  const t = today(), wk = addDays(t, 7);
  const act = st.buyers.filter(b => stageK(b.stage) !== 'lost');
  const overdue = act.filter(isOverdue).sort((a, b) => a.nextDate.localeCompare(b.nextDate));
  const soon = act.filter(b => isYmd(b.nextDate) && b.nextDate >= t && b.nextDate <= wk).sort((a, b) => a.nextDate.localeCompare(b.nextDate));
  const taken = new Set([...overdue, ...soon].map(b => b.id));
  const untouched = act.filter(b => !taken.has(b.id) && !fusOf(b.id).length).sort((a, b) => gradeK(a.grade).localeCompare(gradeK(b.grade)));
  untouched.forEach(b => taken.add(b.id));
  const later = act.filter(b => !taken.has(b.id) && isYmd(b.nextDate)).sort((a, b) => a.nextDate.localeCompare(b.nextDate));
  later.forEach(b => taken.add(b.id));
  const noplan = act.filter(b => !taken.has(b.id));
  const ids = new Set(st.buyers.map(b => b.id));
  const log = S.followups.filter(f => ids.has(f.buyerId)).sort(byDateDesc).slice(0, 30);
  const sec = (cls, title, desc, list) => `<section class="fu-sec ${cls}"><header><h3>${title}</h3><span class="count ${cls === 'sec-bad' && list.length ? 'bad' : ''}">${list.length}</span><p>${desc}</p></header>${list.length ? list.map(fuCard).join('') : `<div class="fu-empty">해당 바이어가 없습니다.</div>`}</section>`;
  return `<div class="fu-grid">
    <div>
      ${sec('sec-bad', '지연', '예정일이 지난 다음 액션', overdue)}
      ${sec('sec-warn', '7일 이내', `~${fmtMD(wk)}`, soon)}
      ${sec('sec-new', '미착수', '상담 후 아직 연락 기록이 없음 · A등급 우선', untouched)}
      ${later.length ? sec('', '예정', '8일 이후', later) : ''}

/* ---------- writes ---------- */
function errMsg(e) {
  switch (e && e.code) {
    case 'invalid_argument': return '저장 권한이 없거나 입력 형식이 맞지 않아 저장하지 못했습니다.';
    case 'quota_exceeded': return '저장 공간 한도에 도달했습니다. 오래된 기록을 정리한 뒤 다시 저장하세요.';
    case 'resource_exhausted': return '요청이 몰려 저장하지 못했습니다. 잠시 후 다시 저장하세요.';
    case 'revoked': return '접근 권한이 바뀌어 저장할 수 없습니다.';
    case 'unauthorized': return '접속 코드가 바뀌었거나 맞지 않습니다. 다시 로그인해 주세요.';
    case 'busy': return '동시에 저장하는 사람이 많아 저장하지 못했습니다. 다시 저장해 주세요.';
    case 'too_large': return '내용이 너무 길어 저장하지 못했습니다. 메모를 나눠서 저장해 주세요.';
    case 'not_found': return '다른 사람이 이미 삭제한 기록입니다. 화면을 새로고침해 주세요.';
    case 'setup_required': return '서버 초기 설정이 끝나지 않았습니다 (ACCESS_CODE 없음).';
    default: return '연결이 불안정해 저장하지 못했습니다. 잠시 후 다시 시도하세요.';
  }
}
async function run(fn) {
  try { await fn(); return true; }
  catch (e) {
    if (e && (e.code === 'unavailable' || e.code === 'busy')) {
      await new Promise(r => setTimeout(r, 800 + Math.random() * 800));
      try { await fn(); return true; } catch (e2) { e = e2; }
    }
    toast(errMsg(e), 'bad');
    if (e && e.code === 'unauthorized') logout('접속 코드가 바뀌었습니다. 다시 입력해 주세요.');
    return false;
  }
}
function guardWrite() {
  if (S.status === 'connecting' || S.status === 'loading') { toast('데이터를 불러오는 중입니다. 잠시 후 다시 눌러 주세요.'); return false; }
  if (!canWrite()) { toast('이 화면에서는 입력할 수 없습니다.', 'bad'); return false; }
  return true;
}

function readContacts(box) {
  return [...box.querySelectorAll('.ct-row')].map(r => ({
    name:r.querySelector('.ct-name').value.trim(), title:r.querySelector('.ct-title').value.trim(), email:r.querySelector('.ct-email').value.trim(),
    phone:r.querySelector('.ct-phone').value.trim(), msg:r.querySelector('.ct-msg').value.trim()
  })).filter(c => c.name || c.email || c.phone || c.msg);
}
function mountTags(root, initial) {
  let tags = [...(initial || [])];
  const input = root.querySelector('input'), list = root.querySelector('.tags-list');
  const draw = () => { list.innerHTML = tags.map((t, i) => `<span class="tag">${esc(t)}<button type="button" data-i="${i}" aria-label="${esc(t)} 삭제">×</button></span>`).join(''); };
  const add = v => { uniq(v.split(',').map(x => x.trim())).forEach(x => { if (!tags.includes(x)) tags.push(x); }); input.value = ''; draw(); };
  input.addEventListener('keydown', e => {
    if (e.isComposing) return;
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); if (input.value.trim()) add(input.value); }
    else if (e.key === 'Backspace' && !input.value && tags.length) { tags.pop(); draw(); }
  });
  input.addEventListener('change', () => { if (input.value.trim()) add(input.value); });
  list.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) { tags.splice(+b.dataset.i, 1); draw(); } });
  draw();
  return () => { if (input.value.trim()) add(input.value); return tags; };
}

      busy(root, true, '저장 중…');
      const linked = linkedId && buyerById(linkedId) ? buyerById(linkedId) : null;

        const buyerData = Object.assign({}, co, {
          contacts, nextAction, nextDate, updatedAt: now,

        });
        if (linked) await bRef.update(buyerData);

      });
      busy(root, false, m ? '수정 내용 저장' : '저장');
      if (!ok) { removePhotos(fresh); fresh.forEach(p => { p.id = ''; p.thumb = ''; }); return; }
      removePhotos(removed);
      closeModal();
      toast((m ? '상담 기록을 수정했습니다.' : `${co.company} 상담을 저장했습니다.`) + (picFail ? ` 사진 ${picFail}장은 저장하지 못했습니다.` : ''));
      S.view = 'show'; S.showId = sid; S.tab = 'daily';
      if (S.day !== 'all') S.day = date >= showById(sid).startDate && date <= showById(sid).endDate ? date : 'all';

    });
  });

/* ---------- business cards ---------- */
const isAssetId = id => typeof id === 'string' && /^[A-Za-z0-9_-]{10,100}$/.test(id);
const isImageFile = f => /^image\//.test(f.type || '') || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name || '');
const blankCard = () => ({company:'', country:'', city:'', website:'', bizType:'', notes:'', contacts:[]});
function cardZone(id) {
  return `<div class="cardzone" id="${id}">
    <div class="cz-row"><label class="btn btn-primary filebtn">명함 사진으로 자동 입력<input type="file" id="${id}-file" accept="image/*" multiple aria-label="명함 사진 선택"></label><p>앞·뒷면 최대 2장. 사진을 끌어다 놓거나 붙여넣어도 됩니다. 읽은 내용은 아래 칸에 파란색으로 채워집니다.</p></div>
    <div class="cz-thumbs" id="${id}-thumbs" hidden></div>
    <div class="cz-status" id="${id}-status" hidden></div>
  </div>`;
}
function bindDrop(zone, take) {
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag'); if (e.dataTransfer) take(e.dataTransfer.files); });
}
function bindDayPicker(root, p, keepDate) {
  const q = i => root.querySelector('#' + p + '-' + i);
  const draw = () => {
    const s = showById(q('show').value), cur = q('date').value;
    q('days').innerHTML = showDays(s).map((d, i) => `<button type="button" class="daychip ${d === cur ? 'on' : ''}" data-date="${d}"><b>${fmtMD(d)}</b><small>${i + 1}일차</small></button>`).join('');
  };
  q('show').addEventListener('change', () => { if (!keepDate) q('date').value = defaultDateFor(showById(q('show').value)); draw(); });
  q('days').addEventListener('click', e => { const c = e.target.closest('.daychip'); if (c) { q('date').value = c.dataset.date; draw(); } });
  q('date').addEventListener('input', draw);
  draw();
}
async function prepImage(file, max = 1600, quality = 0.86) {
  try {
    const bmp = await createImageBitmap(file, {imageOrientation:'from-image'});
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
    return blob || file;
  } catch (_) { return file; }
}

          else made.set(key, {id:bRef.id, meetingId:mRef.id, contacts:mergeContacts(ex ? ex.contacts || [] : [], cts), photos:photoArr});
          items.splice(items.indexOf(it), 1);
          const el = list.querySelector(`[data-item="${it.id}"]`); if (el) el.remove();
          URL.revokeObjectURL(it.url);
        } else { fail++; if (ph) removePhotos([ph]); }
      }
      delete btn.dataset.saving;
      if (!fail && !items.length) {
        closeModal();
        toast(`명함 ${ok}건을 저장했습니다.${picFail ? ` 사진 ${picFail}장은 저장하지 못했습니다.` : ''}`);
        S.view = 'show'; S.showId = sid; S.tab = 'daily'; S.day = 'all'; render();
      } else {
        count();
        setErr(root, fail ? `${ok}건 저장, ${fail}건 실패. 남은 명함은 저장을 다시 눌러 주세요.` : `${ok}건 저장했습니다. 회사명이 비어 있는 명함이 남아 있습니다.`);
      }
    });
  });
}

/* ---------- delete / stage ---------- */
async function doDelete(key) {
  const [kind, id] = key.split(':');
  let ok = false;
  if (kind === 'meeting') {
    const m = S.meetings.find(x => x.id === id);
    ok = await run(async () => {
      await col('meetings').doc(id).delete();
      const b = m && buyerById(m.buyerId);
      if (b) { const rest = meetsOf(b.id).filter(x => x.id !== id); await col('buyers').doc(b.id).update({showIds:uniq(rest.map(x => x.showId)).length ? uniq(rest.map(x => x.showId)) : (b.showIds || []), tags:uniq(rest.flatMap(x => x.interests || [])), updatedAt:Date.now()}); }
    });
    if (ok) { toast('상담 기록을 삭제했습니다.'); if (m) removePhotos(meetingPhotos(m)); }
  } else if (kind === 'fu') {
    ok = await run(() => col('followups').doc(id).delete());
    if (ok) toast('팔로우업 기록을 삭제했습니다.');
  } else if (kind === 'buyer') {
    const name = (buyerById(id) || {}).company || '';
    const pics = meetsOf(id).flatMap(meetingPhotos);
    ok = await run(async () => {
      for (const m of meetsOf(id)) await col('meetings').doc(m.id).delete();
      for (const f of fusOf(id)) await col('followups').doc(f.id).delete();
      await col('buyers').doc(id).delete();
    });
    if (ok) {
      toast(`${name} 바이어를 삭제했습니다.`); S.drawerId = null;
      removePhotos(pics);
    }
  }
  S.confirm = null; render();
}
async function setStage(id, stage) {
  const b = buyerById(id); if (!b || stageK(b.stage) === stage || !guardWrite()) return;
  if (await run(() => col('buyers').doc(id).update({stage, updatedAt:Date.now()}))) toast(`${b.company}: ${stageLabel(stage)}(으)로 변경했습니다.`);
}

/* ---------- export ---------- */
async function exportCsv(showId) {
  const s = showById(showId); if (!s || !S.dl) return;
  const cell = v => { v = String(v ?? ''); if (/^[=@]/.test(v) || /^[+\-][^\d\s]/.test(v)) v = "'" + v; return /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const head = ['전시회', '첫 상담일', '회사명', '국가', '도시', '업종', '웹사이트', '등급', '진행 단계', '담당자', '직책', '이메일', '전화', '메신저', '추가 담당자', '관심 제품', '요청사항', '상담 메모', '최근 팔로우업일', '최근 팔로우업 내용', '다음 액션', '예정일', '사진 수'];
  const rows = S.buyers.filter(b => inShow(b, s.id)).sort((a, b) => (a.company || '').localeCompare(b.company || '', 'ko')).map(b => {
    const ms = meetsOf(b.id).filter(m => m.showId === s.id).slice().reverse();
    const c = primary(b), f = fusOf(b.id)[0] || {};
    return [s.name, (ms[0] || {}).date || '', b.company, b.country, b.city, b.bizType, b.website, gradeK(b.grade), stageLabel(b.stage), c.name, c.title, c.email, c.phone, c.msg,
      (b.contacts || []).slice(1).map(x => [x.name, x.title, x.email, x.phone].filter(Boolean).join(' / ')).join(' | '),
      uniq(ms.flatMap(m => m.interests || [])).join(', '), uniq(ms.flatMap(m => m.requests || [])).join(', '),
      ms.map(m => `[${m.date}] ${m.notes || ''}`).join(' / '), f.date || '', f.content || '', b.nextAction, b.nextDate, ms.reduce((n, x) => n + meetingPhotos(x).length, 0)];
  });
  const csv = '﻿' + [head, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `${s.name.replace(/[\\/:*?"<>|]/g, ' ')}_바이어리스트_${today()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('CSV 파일을 내려받았습니다.');
}

/* ---------- copy ---------- */
function copyText(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = '복사됨'; setTimeout(() => { btn.textContent = o; }, 1200); };
  try {
    navigator.clipboard.writeText(text).then(done, () => selectFallback(btn));
  } catch (_) { selectFallback(btn); }
}
function selectFallback(btn) {
  const v = btn.parentElement && btn.parentElement.querySelector('.val');
  if (v) { const r = document.createRange(); r.selectNodeContents(v); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('선택된 텍스트를 복사해 주세요.'); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  switch (act) {
    case 'home': S.view = 'home'; S.drawerId = null; render(); window.scrollTo(0, 0); break;
    case 'open-show': S.view = 'show'; S.showId = id; S.tab = 'daily'; S.day = 'all'; S.q = ''; S.country = 'all'; S.grade = 'all'; render(); window.scrollTo(0, 0); break;
    case 'tab': S.tab = t.dataset.tab; render(); break;
    case 'day': S.day = S.day === t.dataset.day && t.classList.contains('bar') ? 'all' : t.dataset.day; S.tab = 'daily'; render(); break;
    case 'scope': S.scope = t.dataset.v; render(); break;
    case 'jump': { const g = document.getElementById('pb-L-' + t.dataset.k); if (g) g.scrollIntoView({behavior:'smooth', block:'start'}); break; }
    case 'open-buyer': S.drawerId = id; S.confirm = null; renderDrawer(); break;
    case 'close-drawer': S.drawerId = null; S.confirm = null; renderDrawer(); break;
    case 'new-meeting': openMeetingForm({buyerId:t.dataset.buyer || null}); break;
    case 'edit-meeting': openMeetingForm({meetingId:id}); break;
    case 'new-fu': openFuForm({buyerId:t.dataset.buyer || null}); break;
    case 'edit-fu': openFuForm({fuId:id}); break;
    case 'edit-buyer': openBuyerForm(id); break;
    case 'new-show': openShowForm(); break;
    case 'edit-show': openShowForm(id); break;
    case 'close-modal': closeModal(); break;
    case 'set-stage': setStage(id, t.dataset.stage); break;
    case 'ask-del': S.confirm = t.dataset.key; renderDrawer(); break;
    case 'cancel-del': S.confirm = null; renderDrawer(); break;
    case 'do-del': doDelete(t.dataset.key); break;
    case 'copy': e.stopPropagation(); copyText(t.dataset.text, t); break;
    case 'export': exportCsv(id); break;
    case 'card-batch': openCardBatch(); break;
    case 'view-photo': { const b = buyerById(id); if (b) { const list = buyerPhotos(b); openLightbox(list, Math.max(0, list.findIndex(p => p.id === t.dataset.pid))); } break; }
    case 'lb-prev': stepLb(-1); break;
    case 'lb-next': stepLb(1); break;
    case 'add-photo': openMeetingForm({meetingId:t.dataset.mid, focusPhotos:true}); break;
    case 'refresh': if (S.db) S.db.refresh().then(() => toast('최신 내용으로 새로고침했습니다.'), onRefreshErr); break;
    case 'logout': logout(''); break;
    case 'close-lightbox': closeLb(); break;
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (!$('#lightbox').hidden) {
    if (e.key === 'Escape') { closeLb(); return; }
    if (e.key === 'ArrowLeft') { stepLb(-1); return; }
    if (e.key === 'ArrowRight') { stepLb(1); return; }
  }
  if (e.key === 'Escape' && $('#modal').hidden && S.drawerId) { S.drawerId = null; S.confirm = null; renderDrawer(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'pb-q') { S.q = e.target.value; const r = $('#pb-results'); if (r) r.innerHTML = renderBookResults(S.scope === 'all' ? S.buyers : S.buyers.filter(b => inShow(b, S.showId))); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'pb-country') { S.country = e.target.value; render(); }
  if (e.target.id === 'pb-grade') { S.grade = e.target.value; render(); }
});

/* ---------- server (Google Apps Script) ---------- */
const COLS = ['shows', 'buyers', 'meetings', 'followups'];
const store = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } },
  set: (k, v) => { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (_) {} }
};
const cfgUrl = () => String((window.LK_CONFIG && window.LK_CONFIG.apiUrl) || '').trim();
const API = {
  url: () => cfgUrl() || store.get('lk-api'),
  async call(action, payload, signal) {
    let res;
    try {
      res = await fetch(API.url(), {
        method:'POST', redirect:'follow', signal,
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(Object.assign({action, code:store.get('lk-code')}, payload || {}))
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw {code:'cancelled'};
      throw {code:'unavailable', message:String(e && e.message || e)};
    }
    let j;
    try { j = await res.json(); } catch (_) { throw {code:'unavailable', message:'HTTP ' + res.status}; }
    if (!j || !j.ok) throw {code:(j && j.error) || 'unavailable', message:(j && j.message) || ''};
    return j;
  }
};
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

// Same surface the page used with the shared database: collection(name).doc(id).set/update/delete and onSnapshot.
function makeDb() {
  const cache = Object.fromEntries(COLS.map(c => [c, new Map()]));
  const subs = Object.fromEntries(COLS.map(c => [c, []]));
  let loaded = false, writeSeq = 0, pending = 0, inflight = null;
  const emit = name => {
    const docs = [...cache[name].entries()].map(([id, d]) => ({id, data:() => d}));
    subs[name].forEach(fn => fn({docs}));
  };
  const write = async (name, fn) => {
    pending++; writeSeq++;
    try { return await fn(); } finally { pending--; writeSeq++; }
  };
  const ref = (name, id) => ({
    id,
    set: data => write(name, async () => {
      const j = await API.call('save', {collection:name, id, doc:data});
      cache[name].set(id, j.doc); emit(name);
    }),
    update: fields => write(name, async () => {
      const j = await API.call('patch', {collection:name, id, fields});
      cache[name].set(id, j.doc); emit(name);
    }),
    delete: () => write(name, async () => {
      await API.call('remove', {collection:name, id});
      cache[name].delete(id); emit(name);
    })
  });
  const db = {
    collection: name => ({
      doc: id => ref(name, id || newId()),
      onSnapshot(next) {
        subs[name].push(next);
        if (loaded) setTimeout(() => emit(name));
        return () => { subs[name] = subs[name].filter(f => f !== next); };
      }
    }),
    refresh() {
      if (inflight) return inflight;
      const seq = writeSeq;
      inflight = API.call('load').then(j => {
        if (pending || seq !== writeSeq) { setTimeout(() => db.refresh().catch(onRefreshErr), 1500); return; }
        COLS.forEach(c => { cache[c] = new Map((j[c] || []).map(d => [d.id, d])); });
        loaded = true;
        if (S.status === 'offline') S.status = 'ready';
        COLS.forEach(emit);
      }).finally(() => { inflight = null; });
      return inflight;
    }
  };
  return db;
}
function subscribe(name) {
  S.db.collection(name).onSnapshot(snap => {
    S[name] = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
    S.got[name] = true;
    if (COLS.every(c => S.got[c])) S.status = 'ready';
    scheduleRender();
  });
}
let pollTimer = 0;
function onRefreshErr(e) {
  if (e && e.code === 'unauthorized') { logout('접속 코드가 바뀌었습니다. 다시 입력해 주세요.'); return; }
  if (S.status !== 'offline') { S.status = 'offline'; scheduleRender(); }
}
function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (document.visibilityState === 'visible' && S.db) S.db.refresh().catch(onRefreshErr); }, 30000);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.db) S.db.refresh().catch(onRefreshErr); });

/* ---------- login ---------- */
function showLogin(msg) {
  $('#login').hidden = false;
  $('#lg-api-wrap').hidden = !!cfgUrl();
  $('#lg-api').value = store.get('lk-api');
  $('#lg-name').value = store.get('lk-name') || lastStaff();
  $('#lg-err').textContent = msg || '';
  const first = !cfgUrl() && !$('#lg-api').value ? '#lg-api' : '#lg-code';
  $(first).focus();
}
function logout(msg) {
  clearInterval(pollTimer);
  store.set('lk-code', '');
  S.db = null; S.got = {}; S.status = 'connecting'; S.drawerId = null;
  COLS.forEach(c => { S[c] = []; });
  closeModal(); render();
  showLogin(msg);
}
async function connect() {
  S.meName = store.get('lk-name'); S.meId = S.meName || null;
  S.status = 'loading'; render();
  try {
    const ping = await API.call('ping');
    S.cardOK = !!ping.ocr; S.assets = !!(ping.photos || ping.cards);
    S.db = makeDb(); S.got = {};
    COLS.forEach(subscribe);
    await S.db.refresh();
    startPolling();
    return '';
  } catch (e) {
    S.db = null; S.status = 'connecting'; render();
    if (e && e.code === 'unauthorized') return '접속 코드가 맞지 않습니다.';
    if (e && e.code === 'setup_required') return '서버 초기 설정이 끝나지 않았습니다. Apps Script 스크립트 속성에 ACCESS_CODE를 추가해 주세요.';
    return '서버에 연결하지 못했습니다. 서버 주소와 인터넷 연결을 확인해 주세요.';
  }
}
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const api = cfgUrl() || $('#lg-api').value.trim(), code = $('#lg-code').value.trim(), name = $('#lg-name').value.trim();
  const err = m => { $('#lg-err').textContent = m; };
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(api)) return err('서버 주소는 https://script.google.com/macros/s/…/exec 형식이어야 합니다.');
  if (!code) return err('접속 코드를 입력해 주세요.');
  if (!name) return err('이름을 입력해 주세요.');
  if (!cfgUrl()) store.set('lk-api', api);
  store.set('lk-code', code); store.set('lk-name', name); rememberStaff(name);
  const btn = $('#lg-go'); btn.disabled = true; btn.textContent = '확인 중…'; err('');
  const msg = await connect();
  btn.disabled = false; btn.textContent = '입장';
  if (msg) { store.set('lk-code', ''); err(msg); }
  else { $('#login').hidden = true; $('#lg-code').value = ''; }
});

function init() {
  render();
  if (API.url() && store.get('lk-code') && store.get('lk-name')) {
    connect().then(msg => { if (msg) showLogin(msg); });
  } else showLogin('');
}
init();
})();
</script>
